name: Naoki
bio: |
  I'm Naoki, a system engineer based in Tokyo, Japan.
  I specialize in building web applications and websites using JavaScript and PHP.

  I've procrastinated on building this website for years, but finally, it's here —
  a little nook on the internet for me to share my experiments, projects, and thoughts on tech, design, and life.

  During the day, I work as a developer at a system integrator, and at night or on weekends, I’m busy tinkering with various tools and apps I’m building.
